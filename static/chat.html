<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 聊天工作台</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --line: #d9e0ea;
    --line-strong: #c4cede;
    --text: #152033;
    --muted: #667085;
    --primary: #155eef;
    --primary-soft: #dbeafe;
    --success: #0f8b5f;
    --warning: #a16207;
    --danger: #c62828;
    --shadow: 0 16px 32px rgba(15, 23, 42, 0.08);
    --radius: 8px;
    --sidebar-width: 340px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #f8f9fc 0%, #eef3f9 100%);
    color: var(--text);
  }
  button, input, textarea, select { font: inherit; }
  button {
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, opacity 0.12s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { cursor: not-allowed; opacity: 0.5; transform: none; }

  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    gap: 12px;
    padding: 12px;
  }

  .sidebar,
  .workspace { min-width: 0; }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel,
  .workspace-bar,
  .messages,
  .composer {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .panel { padding: 14px; }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .panel-subtle {
    font-size: 12px;
    color: var(--muted);
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    color: var(--muted);
  }

  .field input,
  .field select,
  .composer textarea {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    outline: none;
  }

  .field input:focus,
  .field select:focus,
  .composer textarea:focus {
    border-color: rgba(21, 94, 239, 0.72);
    box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.08);
  }

  .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .row > * { flex: 1 1 0; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    color: var(--text);
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .btn-ghost {
    background: #fff;
  }

  .btn-danger {
    color: var(--danger);
    background: #fff;
    border-color: rgba(198, 40, 40, 0.22);
  }

  .btn-icon {
    width: 38px;
    height: 38px;
    padding: 0;
    background: var(--surface-alt);
    border: 1px solid var(--line);
  }

  .btn svg,
  .btn-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: 0 0 auto;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 26px;
    padding: 5px 8px;
    border-radius: 999px;
    background: #edf2ff;
    color: #334155;
    border: 1px solid transparent;
    font-size: 12px;
  }

  .badge[data-tone="success"] {
    background: #e7faf1;
    color: var(--success);
  }

  .badge[data-tone="warning"] {
    background: #fff7ed;
    color: var(--warning);
  }

  .badge[data-tone="danger"] {
    background: #fef2f2;
    color: var(--danger);
  }

  .badge[data-tone="neutral"] {
    background: #eef2f7;
    color: #334155;
  }

  .features {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .feature {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface-alt);
    font-size: 13px;
  }

  .feature input {
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: var(--primary);
  }

  .workspace {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .workspace-bar {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .workspace-title {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .workspace-title h1 {
    margin: 0;
    font-size: 15px;
  }

  .workspace-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .messages {
    flex: 1;
    min-height: 0;
    overflow: auto;
    margin-top: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .empty-state {
    margin: auto;
    color: var(--muted);
    font-size: 13px;
  }

  .message {
    display: flex;
    max-width: min(760px, 86%);
  }

  .message--user {
    align-self: flex-end;
    justify-content: flex-end;
  }

  .message--assistant,
  .message--system {
    align-self: flex-start;
  }

  .bubble {
    width: 100%;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 12px 13px;
    background: var(--surface-alt);
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.65;
    font-size: 14px;
  }

  .message--user .bubble {
    background: #dbeafe;
    border-color: #bfdbfe;
  }

  .message--assistant .bubble {
    background: #f8fafc;
  }

  .message--system .bubble {
    background: #fff7ed;
    border-color: #fed7aa;
    color: #7c2d12;
  }

  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .content {
    white-space: pre-wrap;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1.1em;
    margin-left: 2px;
    border-radius: 2px;
    background: var(--primary);
    animation: blink 1s steps(1, end) infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .composer {
    margin-top: 12px;
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .composer textarea {
    flex: 1;
    min-height: 58px;
    max-height: 220px;
    resize: vertical;
  }

  .composer-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  @media (max-width: 1100px) {
    .shell {
      grid-template-columns: 1fr;
    }

    .sidebar { order: 2; }
    .workspace { order: 1; }
    .message { max-width: 94%; }
  }

  @media (max-width: 720px) {
    .shell {
      padding: 10px;
      gap: 10px;
    }

    .features {
      grid-template-columns: 1fr;
    }

    .workspace-bar,
    .panel,
    .messages,
    .composer {
      padding: 12px;
    }

    .composer {
      flex-direction: column;
      align-items: stretch;
    }

    .composer-actions {
      width: 100%;
      justify-content: space-between;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">认证</div>
          <div class="panel-subtle">登录、注册与本地状态</div>
        </div>
        <div class="badge" id="authBadge" data-tone="neutral">未登录</div>
      </div>
      <div class="stack">
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="email@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="密码" autocomplete="current-password">
        </div>
        <div class="row">
          <button class="btn btn-primary" id="loginBtn" type="button">登录</button>
          <button class="btn btn-ghost" id="registerBtn" type="button">注册</button>
        </div>
        <div class="row">
          <button class="btn btn-ghost" id="resetBtn" type="button">清理</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">会话</div>
          <div class="panel-subtle">选择、同步、删除</div>
        </div>
        <button class="btn btn-icon" id="refreshSessionsBtn" type="button" title="刷新会话" aria-label="刷新会话">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
      <div class="stack">
        <div class="field">
          <label for="sessionName">名称</label>
          <input id="sessionName" type="text" placeholder="New Chat" autocomplete="off">
        </div>
        <div class="row">
          <button class="btn btn-primary" id="createSessionBtn" type="button">新建</button>
          <button class="btn btn-danger" id="deleteSessionBtn" type="button">删除</button>
        </div>
        <div class="field">
          <label for="sessionSelect">当前会话</label>
          <select id="sessionSelect"></select>
        </div>
        <div class="row">
          <button class="btn btn-ghost" id="clearHistoryBtn" type="button">清空历史</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">工具</div>
          <div class="panel-subtle">动态能力开关</div>
        </div>
        <div class="badge" id="featureBadge" data-tone="neutral">默认</div>
      </div>
      <div class="features">
        <label class="feature"><input type="checkbox" id="f_web_search"> 联网搜索</label>
        <label class="feature"><input type="checkbox" id="f_code_interpreter"> 代码沙盒</label>
        <label class="feature"><input type="checkbox" id="f_memory_tools"> 长期记忆</label>
        <label class="feature"><input type="checkbox" id="f_email_assistant"> 邮件助手</label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">状态</div>
          <div class="panel-subtle">本地调试信息</div>
        </div>
      </div>
      <div class="badges">
        <span class="badge" id="apiBadge" data-tone="neutral">API</span>
        <span class="badge" id="sessionBadge" data-tone="neutral">会话</span>
        <span class="badge" id="streamBadge" data-tone="neutral">空闲</span>
        <span class="badge" id="statusBadge" data-tone="neutral">未连接</span>
      </div>
    </section>
  </aside>

  <main class="workspace">
    <header class="workspace-bar">
      <div class="workspace-title">
        <h1 id="workspaceTitle">聊天工作台</h1>
        <div class="workspace-meta" id="workspaceMeta">未连接</div>
      </div>
      <div class="toolbar">
        <button class="btn btn-icon" id="scrollBottomBtn" type="button" title="滚动到底部" aria-label="滚动到底部">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="m5 12 7 7 7-7" />
          </svg>
        </button>
        <button class="btn btn-icon" id="stopBtn" type="button" title="停止生成" aria-label="停止生成" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <footer class="composer">
      <textarea id="input" rows="3" placeholder="消息"></textarea>
      <div class="composer-actions">
        <button class="btn btn-primary" id="sendBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z" />
            <path d="M22 2 11 13" />
          </svg>
          <span>发送</span>
        </button>
      </div>
    </footer>
  </main>
</div>

<script>
(() => {
  'use strict';

  const API_DEFAULT = 'http://localhost:8000';
  const STORAGE = {
    apiBase: 'fge:apiBase',
    email: 'fge:email',
    userToken: 'fge:userToken',
    sessionToken: 'fge:sessionToken',
    sessionId: 'fge:sessionId',
    sessionName: 'fge:sessionName',
    selectedSessionId: 'fge:selectedSessionId',
    features: 'fge:features',
    draft: 'fge:draft',
  };

  const DEFAULT_FEATURES = {
    web_search: false,
    code_interpreter: false,
    memory_tools: false,
    email_assistant: false,
  };

  const state = {
    apiBase: resolveApiBase(),
    email: '',
    userToken: '',
    sessionToken: '',
    sessionId: '',
    sessionName: 'New Chat',
    selectedSessionId: '',
    features: { ...DEFAULT_FEATURES },
    sessions: [],
    messages: [],
    draft: '',
    isStreaming: false,
    streamController: null,
  };

  const el = {};

  init();

  function init() {
    cacheElements();
    bindEvents();
    hydrateState();
    renderFeatureControls();
    syncInputs();
    syncSelectOptions();
    syncUi();
    restoreDraft();
    updateComposerHeight();
    bootstrap().catch((error) => {
      syncStatus('启动失败', 'danger');
      appendTransientNotice(`启动失败: ${error.message}`, 'danger');
    });
  }

  function cacheElements() {
    const ids = [
      'email', 'password', 'loginBtn', 'registerBtn', 'resetBtn',
      'refreshSessionsBtn', 'createSessionBtn', 'deleteSessionBtn',
      'sessionName', 'sessionSelect', 'clearHistoryBtn',
      'sendBtn', 'stopBtn', 'scrollBottomBtn',
      'input', 'messages',
      'authBadge', 'featureBadge', 'apiBadge', 'sessionBadge', 'streamBadge', 'statusBadge',
      'workspaceTitle', 'workspaceMeta',
      'f_web_search', 'f_code_interpreter', 'f_memory_tools', 'f_email_assistant',
    ];
    for (const id of ids) {
      el[id] = document.getElementById(id);
    }
  }

  function bindEvents() {
    el.loginBtn.addEventListener('click', login);
    el.registerBtn.addEventListener('click', register);
    el.resetBtn.addEventListener('click', resetLocalState);
    el.refreshSessionsBtn.addEventListener('click', () => loadSessions().catch(handleError));
    el.createSessionBtn.addEventListener('click', createSession);
    el.deleteSessionBtn.addEventListener('click', deleteSession);
    el.clearHistoryBtn.addEventListener('click', clearHistory);
    el.sendBtn.addEventListener('click', sendMessage);
    el.stopBtn.addEventListener('click', stopStreaming);
    el.scrollBottomBtn.addEventListener('click', scrollMessagesToBottom);

    el.sessionSelect.addEventListener('change', onSessionSelectChange);
    el.input.addEventListener('input', () => {
      state.draft = el.input.value;
      persistState();
      updateComposerHeight();
    });
    el.input.addEventListener('keydown', onComposerKeydown);

    el.email.addEventListener('input', () => {
      state.email = el.email.value.trim();
      persistState();
      syncUi();
    });
    el.password.addEventListener('input', () => {
      state.password = el.password.value;
    });
    el.sessionName.addEventListener('input', () => {
      state.sessionName = el.sessionName.value.trim();
      persistState();
    });

    for (const [key, checkbox] of featureCheckboxEntries()) {
      checkbox.addEventListener('change', () => {
        state.features[key] = checkbox.checked;
        persistState();
        syncUi();
      });
    }

    window.addEventListener('beforeunload', persistState);
    window.addEventListener('resize', updateComposerHeight);
  }

  function hydrateState() {
    state.email = readStorage(STORAGE.email, '');
    state.userToken = readStorage(STORAGE.userToken, '');
    state.sessionToken = readStorage(STORAGE.sessionToken, '');
    state.sessionId = readStorage(STORAGE.sessionId, '');
    state.sessionName = readStorage(STORAGE.sessionName, 'New Chat');
    state.selectedSessionId = readStorage(STORAGE.selectedSessionId, state.sessionId || '');
    state.draft = readStorage(STORAGE.draft, '');
    state.features = { ...DEFAULT_FEATURES, ...readJsonStorage(STORAGE.features, {}) };
  }

  function syncInputs() {
    el.email.value = state.email;
    el.password.value = '';
    el.sessionName.value = state.sessionName || 'New Chat';
    el.input.value = state.draft;
    syncFeatureCheckboxes();
    updateComposerHeight();
  }

  function renderFeatureControls() {
    syncFeatureCheckboxes();
    const enabled = Object.values(state.features).filter(Boolean).length;
    el.featureBadge.textContent = enabled ? `${enabled} 开启` : '默认';
    el.featureBadge.dataset.tone = enabled ? 'success' : 'neutral';
  }

  function syncFeatureCheckboxes() {
    for (const [key, checkbox] of featureCheckboxEntries()) {
      checkbox.checked = !!state.features[key];
    }
  }

  function featureCheckboxEntries() {
    return [
      ['web_search', el.f_web_search],
      ['code_interpreter', el.f_code_interpreter],
      ['memory_tools', el.f_memory_tools],
      ['email_assistant', el.f_email_assistant],
    ];
  }

  function syncSelectOptions() {
    el.sessionSelect.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = state.sessions.length ? '选择会话' : '无会话';
    placeholder.disabled = true;
    placeholder.selected = !state.sessionId;
    el.sessionSelect.appendChild(placeholder);

    for (const session of state.sessions) {
      const option = document.createElement('option');
      option.value = session.session_id;
      option.textContent = formatSessionLabel(session);
      option.selected = session.session_id === (state.selectedSessionId || state.sessionId);
      el.sessionSelect.appendChild(option);
    }
  }

  function syncUi() {
    renderFeatureControls();
    syncAuthBadge();
    syncSessionBadge();
    syncStreamBadge();
    syncWorkspaceMeta();
    syncButtons();
    syncApiBadge();
  }

  function syncAuthBadge() {
    const token = getAnyAuthToken();
    if (!token) {
      setBadge(el.authBadge, '未登录', 'warning');
      return;
    }
    setBadge(el.authBadge, '已登录', 'success');
  }

  function syncSessionBadge() {
    if (!state.sessionId) {
      setBadge(el.sessionBadge, '无会话', 'warning');
      return;
    }
    setBadge(el.sessionBadge, shortId(state.sessionId), 'success');
  }

  function syncStreamBadge() {
    if (state.isStreaming) {
      setBadge(el.streamBadge, '生成中', 'warning');
      return;
    }
    setBadge(el.streamBadge, '空闲', 'neutral');
  }

  function syncApiBadge() {
    const url = new URL(state.apiBase);
    setBadge(el.apiBadge, `API ${url.host}`, 'neutral');
  }

  function syncWorkspaceMeta() {
    const pieces = [];
    if (state.email) pieces.push(state.email);
    if (state.sessionId && state.sessionName) pieces.push(state.sessionName);
    if (state.sessionId) pieces.push(shortId(state.sessionId));
    if (!pieces.length) pieces.push('未连接');
    el.workspaceMeta.textContent = pieces.join(' · ');
    el.workspaceTitle.textContent = state.sessionId ? (state.sessionName || 'New Chat') : '聊天工作台';
  }

  function syncButtons() {
    const authReady = !!getAnyAuthToken();
    const sessionReady = !!state.sessionToken && !!state.sessionId;
    el.createSessionBtn.disabled = !authReady || state.isStreaming;
    el.refreshSessionsBtn.disabled = !authReady || state.isStreaming;
    el.deleteSessionBtn.disabled = !sessionReady || state.isStreaming;
    el.clearHistoryBtn.disabled = !sessionReady || state.isStreaming;
    el.sendBtn.disabled = !sessionReady || state.isStreaming;
    el.stopBtn.disabled = !state.isStreaming;
    el.sessionSelect.disabled = !state.sessions.length || state.isStreaming;
  }

  async function bootstrap() {
    if (!getAnyAuthToken()) {
      renderMessages([]);
      syncStatus('未登录', 'warning');
      syncUi();
      return;
    }

    await loadSessions({ preferSessionId: state.selectedSessionId || state.sessionId, quiet: true });

    if (state.sessionId) {
      await loadHistory({ quiet: true });
    } else {
      renderMessages([]);
    }
  }

  async function login() {
    const email = el.email.value.trim();
    const password = el.password.value;

    if (!email || !password) {
      syncStatus('请填写邮箱和密码', 'warning');
      appendTransientNotice('请先补全认证信息', 'warning');
      return;
    }

    try {
      syncStatus('登录中', 'neutral');
      const form = new URLSearchParams();
      form.append('username', email);
      form.append('password', password);

      const data = await requestJson('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: form,
      }, { auth: false });

      state.email = email;
      state.userToken = data.access_token;
      state.password = '';
      persistState();
      syncInputs();
      syncUi();
      syncStatus('登录成功', 'success');
      appendTransientNotice('登录成功', 'success');
      await loadSessions({ quiet: true });
      if (state.sessionId) {
        await loadHistory({ quiet: true });
      } else {
        await createSession({ quiet: true });
      }
    } catch (error) {
      handleError(error, '登录失败');
    }
  }

  async function register() {
    const email = el.email.value.trim();
    const password = el.password.value;

    if (!email || !password) {
      syncStatus('请填写邮箱和密码', 'warning');
      appendTransientNotice('请先补全认证信息', 'warning');
      return;
    }

    try {
      syncStatus('注册中', 'neutral');
      const data = await requestJson('/api/v1/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      }, { auth: false });

      state.email = email;
      state.userToken = data.token.access_token;
      state.password = '';
      persistState();
      syncInputs();
      syncUi();
      syncStatus(`注册成功 #${data.id}`, 'success');
      appendTransientNotice('注册成功', 'success');
      await createSession({ quiet: true });
    } catch (error) {
      handleError(error, '注册失败');
    }
  }

  async function createSession({ quiet = false } = {}) {
    const authToken = getAnyAuthToken();
    if (!authToken) {
      syncStatus('请先认证', 'warning');
      appendTransientNotice('请先登录或注册', 'warning');
      return;
    }

    const sessionName = normalizeSessionName(el.sessionName.value) || 'New Chat';

    try {
      if (!quiet) syncStatus('创建会话中', 'neutral');
      const data = await requestJson(`/api/v1/auth/sessions?name=${encodeURIComponent(sessionName)}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${authToken}` },
      }, { auth: false });

      state.sessionId = data.session_id;
      state.sessionToken = data.token.access_token;
      state.sessionName = data.name || sessionName;
      state.selectedSessionId = state.sessionId;
      state.messages = [];
      persistState();
      syncInputs();
      syncSelectOptions();
      syncUi();
      renderMessages([]);
      syncStatus('会话已就绪', 'success');
      await loadSessions({ preferSessionId: state.sessionId, quiet: true });
      await loadHistory({ quiet: true });
    } catch (error) {
      handleError(error, '创建会话失败');
    }
  }

  async function loadSessions(options = {}) {
    const authToken = getAnyAuthToken();
    if (!authToken) {
      if (!options.quiet) syncStatus('请先认证', 'warning');
      return;
    }

    try {
      if (!options.quiet) syncStatus('同步会话', 'neutral');
      const data = await requestJson('/api/v1/auth/sessions', {
        method: 'GET',
        headers: { Authorization: `Bearer ${authToken}` },
      }, { auth: false });

      state.sessions = Array.isArray(data) ? data : [];
      syncSelectOptions();

      const preferredId = options.preferSessionId || state.sessionId || state.selectedSessionId;
      const matched = preferredId ? state.sessions.find((item) => item.session_id === preferredId) : null;
      if (matched) {
        applySession(matched);
      } else if (state.sessions.length) {
        applySession(state.sessions[0]);
      } else {
        clearSessionState();
      }

      persistState();
      syncUi();
    } catch (error) {
      if (!options.quiet) handleError(error, '同步会话失败');
    }
  }

  async function onSessionSelectChange() {
    const sessionId = el.sessionSelect.value;
    if (!sessionId) return;
    const selected = state.sessions.find((item) => item.session_id === sessionId);
    if (!selected) return;
    applySession(selected);
    persistState();
    syncUi();
    renderMessages([]);
    try {
      await loadHistory({ quiet: true });
    } catch (error) {
      handleError(error, '载入会话失败');
    }
  }

  function applySession(session) {
    state.sessionId = session.session_id;
    state.sessionToken = session.token?.access_token || '';
    state.sessionName = session.name || 'New Chat';
    state.selectedSessionId = session.session_id;
    el.sessionName.value = state.sessionName;
    persistState();
    syncSelectOptions();
  }

  function clearSessionState() {
    state.sessionId = '';
    state.sessionToken = '';
    state.sessionName = 'New Chat';
    state.selectedSessionId = '';
    state.sessions = [];
    state.messages = [];
    state.draft = '';
    persistState();
    syncSelectOptions();
    el.sessionName.value = state.sessionName;
    el.input.value = '';
    updateComposerHeight();
    renderMessages([]);
    syncStatus('无会话', 'warning');
  }

  async function loadHistory({ quiet = false } = {}) {
    if (!state.sessionToken || !state.sessionId) {
      renderMessages([]);
      return;
    }

    try {
      if (!quiet) syncStatus('载入历史', 'neutral');
      const data = await requestJson('/api/v1/chatbot/history', {
        method: 'GET',
        headers: { Authorization: `Bearer ${state.sessionToken}` },
      }, { auth: false });

      state.messages = Array.isArray(data) ? data : [];
      renderMessages(state.messages);
      syncStatus('历史已同步', 'success');
    } catch (error) {
      if (!quiet) handleError(error, '载入历史失败');
      else appendTransientNotice(`载入历史失败: ${error.message}`, 'danger');
    }
  }

  async function clearHistory() {
    if (!state.sessionToken || !state.sessionId) {
      syncStatus('没有可清空的会话', 'warning');
      return;
    }

    const confirmed = window.confirm('清空当前会话历史？');
    if (!confirmed) return;

    try {
      syncStatus('清空历史中', 'neutral');
      await requestJson('/api/v1/chatbot/history', {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${state.sessionToken}` },
      }, { auth: false });

      state.messages = [];
      renderMessages([]);
      syncStatus('历史已清空', 'success');
      appendTransientNotice('历史已清空', 'success');
    } catch (error) {
      handleError(error, '清空历史失败');
    }
  }

  async function deleteSession() {
    if (!state.sessionId) {
      syncStatus('没有可删除的会话', 'warning');
      return;
    }

    const confirmed = window.confirm(`删除会话 ${shortId(state.sessionId)}？`);
    if (!confirmed) return;

    const authToken = getAnyAuthToken();
    if (!authToken) {
      syncStatus('请先认证', 'warning');
      return;
    }

    try {
      syncStatus('删除会话中', 'neutral');
      await requestJson(`/api/v1/auth/sessions/${encodeURIComponent(state.sessionId)}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${authToken}` },
      }, { auth: false });

      const removedId = state.sessionId;
      state.sessions = state.sessions.filter((item) => item.session_id !== removedId);
      if (state.sessions.length) {
        applySession(state.sessions[0]);
        await loadHistory({ quiet: true });
      } else {
        clearSessionState();
        state.messages = [];
        renderMessages([]);
      }
      persistState();
      syncUi();
      syncStatus('会话已删除', 'success');
    } catch (error) {
      handleError(error, '删除会话失败');
    }
  }

  async function sendMessage() {
    const text = el.input.value.trim();
    if (!text) return;

    if (!state.sessionToken || !state.sessionId) {
      syncStatus('请先创建会话', 'warning');
      appendTransientNotice('没有可用会话', 'warning');
      return;
    }

    if (state.isStreaming) return;

    const userMessage = { role: 'user', content: text };
    state.messages.push(userMessage);
    renderMessages(state.messages);
    scrollMessagesToBottom();

    el.input.value = '';
    state.draft = '';
    persistState();
    updateComposerHeight();
    syncStatus('生成中', 'neutral');

    const assistantNode = appendMessage('assistant', '', { live: true });
    const controller = new AbortController();
    state.streamController = controller;
    state.isStreaming = true;
    syncUi();

    const payload = {
      messages: [{ role: 'user', content: text }],
      features: { ...state.features },
    };

    let buffer = '';
    let aborted = false;

    try {
      const response = await fetch(apiUrl('/api/v1/chatbot/chat/stream'), {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${state.sessionToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(payload),
        signal: controller.signal,
      });

      if (!response.ok) {
        const data = await readResponse(response);
        throw new Error(extractErrorMessage(data, response.statusText));
      }

      if (!response.body) {
        throw new Error('流式响应不可用');
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        assistantNode.textEl.textContent = buffer;
        scrollMessagesToBottomIfNeeded();
      }

      buffer += decoder.decode();
      assistantNode.textEl.textContent = buffer.trimEnd();

      const finalText = buffer.trimEnd();
      if (finalText) {
        state.messages.push({ role: 'assistant', content: finalText });
      } else {
        assistantNode.textEl.textContent = '';
      }
      assistantNode.finish();
      syncStatus('完成', 'success');
    } catch (error) {
      if (error.name === 'AbortError') {
        aborted = true;
        assistantNode.textEl.textContent = buffer.trimEnd() || '已停止';
        assistantNode.finish('已停止');
        appendTransientNotice('已停止生成', 'warning');
        syncStatus('已停止', 'warning');
      } else {
        assistantNode.row.remove();
        appendTransientNotice(`发送失败: ${error.message}`, 'danger');
        syncStatus('发送失败', 'danger');
      }
    } finally {
      state.streamController = null;
      state.isStreaming = false;
      syncUi();
      if (!aborted) {
        scrollMessagesToBottom();
      }
    }
  }

  function stopStreaming() {
    if (state.streamController) {
      state.streamController.abort();
    }
  }

  function onComposerKeydown(event) {
    if (event.isComposing) return;
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  }

  function renderMessages(messages) {
    el.messages.innerHTML = '';
    if (!messages || !messages.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = '暂无消息';
      el.messages.appendChild(empty);
      return;
    }

    for (const message of messages) {
      appendMessage(message.role, message.content);
    }
    scrollMessagesToBottom();
  }

  function appendMessage(role, content, options = {}) {
    removeEmptyState();

    const row = document.createElement('div');
    row.className = `message message--${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const meta = document.createElement('div');
    meta.className = 'meta';

    const label = document.createElement('span');
    label.textContent = role === 'user' ? '我' : role === 'assistant' ? '助手' : '系统';
    meta.appendChild(label);

    if (options.live) {
      const live = document.createElement('span');
      live.textContent = '生成中';
      live.className = 'live-label';
      meta.appendChild(live);
    }

    const contentWrap = document.createElement('div');
    contentWrap.className = 'content';

    const textEl = document.createElement('span');
    textEl.className = 'content-text';
    textEl.textContent = content || '';
    contentWrap.appendChild(textEl);

    if (options.live) {
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      contentWrap.appendChild(cursor);
    }

    bubble.append(meta, contentWrap);
    row.appendChild(bubble);
    el.messages.appendChild(row);

    if (shouldStickToBottom()) {
      scrollMessagesToBottom();
    }

    return {
      row,
      bubble,
      textEl,
      contentWrap,
      finish(label = '') {
        const cursor = contentWrap.querySelector('.cursor');
        const liveLabel = meta.querySelector('.live-label');
        if (cursor) cursor.remove();
        if (liveLabel) {
          if (label) liveLabel.textContent = label;
          else liveLabel.remove();
        }
      },
    };
  }

  function appendTransientNotice(text, tone = 'neutral') {
    const node = appendMessage('system', text);
    node.row.dataset.tone = tone;
    return node;
  }

  function removeEmptyState() {
    const empty = el.messages.querySelector('.empty-state');
    if (empty) empty.remove();
  }

  function shouldStickToBottom() {
    const distance = el.messages.scrollHeight - el.messages.scrollTop - el.messages.clientHeight;
    return distance < 160;
  }

  function scrollMessagesToBottom() {
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function scrollMessagesToBottomIfNeeded() {
    if (shouldStickToBottom()) {
      scrollMessagesToBottom();
    }
  }

  function updateComposerHeight() {
    const input = el.input;
    if (!input) return;
    input.style.height = 'auto';
    const maxHeight = 220;
    input.style.height = `${Math.min(input.scrollHeight, maxHeight)}px`;
  }

  function resetLocalState() {
    const confirmed = window.confirm('清理本地保存的认证和会话状态？');
    if (!confirmed) return;

    state.email = '';
    state.userToken = '';
    state.sessionToken = '';
    state.sessionId = '';
    state.sessionName = 'New Chat';
    state.selectedSessionId = '';
    state.messages = [];
    state.draft = '';
    persistState();
    el.password.value = '';
    syncInputs();
    syncSelectOptions();
    renderMessages([]);
    syncUi();
    syncStatus('已清理本地状态', 'warning');
  }

  function persistState() {
    writeStorage(STORAGE.email, state.email);
    writeStorage(STORAGE.userToken, state.userToken);
    writeStorage(STORAGE.sessionToken, state.sessionToken);
    writeStorage(STORAGE.sessionId, state.sessionId);
    writeStorage(STORAGE.sessionName, state.sessionName);
    writeStorage(STORAGE.selectedSessionId, state.selectedSessionId);
    writeStorage(STORAGE.features, JSON.stringify(state.features));
    writeStorage(STORAGE.draft, state.draft);
    writeStorage(STORAGE.apiBase, state.apiBase);
  }

  function restoreDraft() {
    if (state.draft) {
      el.input.value = state.draft;
      updateComposerHeight();
    }
  }

  function handleError(error, fallback) {
    const message = error instanceof Error ? error.message : String(error);
    syncStatus(fallback || message, 'danger');
    appendTransientNotice(`${fallback || '错误'}: ${message}`, 'danger');
  }

  function syncStatus(text, tone = 'neutral') {
    setBadge(el.statusBadge, text, tone);
  }

  function setBadge(node, text, tone = 'neutral') {
    node.textContent = text;
    node.dataset.tone = tone;
  }

  function normalizeSessionName(value) {
    return (value || '').trim().replace(/\s+/g, ' ').slice(0, 100);
  }

  function shortId(value) {
    if (!value) return '—';
    return value.length > 8 ? `${value.slice(0, 8)}…` : value;
  }

  function formatSessionLabel(session) {
    const name = session.name || 'New Chat';
    return `${name} · ${shortId(session.session_id)}`;
  }

  function resolveApiBase() {
    const saved = readStorage(STORAGE.apiBase, '');
    if (saved) return saved;
    if (window.location.protocol === 'file:') return API_DEFAULT;
    return window.location.origin;
  }

  function apiUrl(path) {
    return `${state.apiBase.replace(/\/$/, '')}${path}`;
  }

  function getAnyAuthToken() {
    return state.userToken || state.sessionToken;
  }

  function readStorage(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value === null ? fallback : value;
    } catch {
      return fallback;
    }
  }

  function writeStorage(key, value) {
    try {
      if (value === undefined || value === null || value === '') {
        localStorage.removeItem(key);
      } else {
        localStorage.setItem(key, value);
      }
    } catch {
      /* ignore storage errors */
    }
  }

  function readJsonStorage(key, fallback) {
    const raw = readStorage(key, '');
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch {
      return fallback;
    }
  }

  async function requestJson(path, options = {}, { auth = true } = {}) {
    const headers = new Headers(options.headers || {});
    const method = (options.method || 'GET').toUpperCase();
    const body = options.body;

    if (auth) {
      const token = getAnyAuthToken();
      if (token && !headers.has('Authorization')) {
        headers.set('Authorization', `Bearer ${token}`);
      }
    }

    if (
      body &&
      !headers.has('Content-Type') &&
      !(body instanceof FormData) &&
      !(body instanceof URLSearchParams) &&
      typeof body !== 'string'
    ) {
      headers.set('Content-Type', 'application/json');
    }

    const response = await fetch(apiUrl(path), {
      ...options,
      method,
      headers,
    });

    const data = await readResponse(response);
    if (!response.ok) {
      throw new Error(extractErrorMessage(data, response.statusText));
    }
    return data;
  }

  async function readResponse(response) {
    const contentType = response.headers.get('content-type') || '';
    if (contentType.includes('application/json')) {
      return response.json();
    }
    return response.text();
  }

  function extractErrorMessage(data, fallback) {
    if (!data) return fallback || '请求失败';
    if (typeof data === 'string') return data || fallback || '请求失败';
    if (typeof data === 'object') {
      if (typeof data.detail === 'string') return data.detail;
      if (Array.isArray(data.detail)) return data.detail.map((item) => item.msg || item.message || JSON.stringify(item)).join('; ');
      if (data.message) return String(data.message);
    }
    return fallback || '请求失败';
  }
})();
</script>
</body>
